<mat-card class="login-card">
    <mat-card-title>Login</mat-card-title>
    <p *ngIf="msg" class="msg">{{msg}}</p>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput type="email" formControlName="username" required>
          <mat-error *ngIf="username?.hasError('required') && username?.touched">
            Username is required
          </mat-error>
          <mat-error *ngIf="username?.hasError('email') && username?.touched">
            Username is must be an email
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" required>
          <mat-error *ngIf="password?.invalid && password?.touched">
            Password is required
          </mat-error>
        </mat-form-field>
  
        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">Login</button>
      </form>
    </mat-card-content>
  </mat-card>
